# Production CI/CD pipeline:
#   1. Pull cache
#   2. Build Docker image
#   3. Push to Artifact Registry
#   4. Deploy to Cloud Run without traffic, tagged 'candidate'
#   5. Smoke-test via the tagged revision URL
#   6. Migrate 100% traffic only after the test passes

steps:
  # ── 1. Pull previous image for layer cache ──────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull \
          $_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest \
          || true

  # ── 2. Build ────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    waitFor: ['pull-cache']
    args:
      - 'build'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'
      - '-f'
      - 'api/Dockerfile'
      - '--cache-from'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '.'

  # ── 3. Push both tags ───────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    waitFor: ['build']
    args:
      - 'push'
      - '--all-tags'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME'

  # ── 4. Deploy to Cloud Run with no traffic ──────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    waitFor: ['push']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--quiet'
      - '--image'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--execution-environment'
      - 'gen2'
      - '--no-traffic'
      - '--tag'
      - 'candidate'
      - '--memory'
      - '8Gi'
      - '--cpu'
      - '4'
      - '--concurrency'
      - '4'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--cpu-boost'
      - '--set-secrets'
      - 'PINECONE_API_KEY=PINECONE_API_KEY:latest,PINECONE_INDEX_NAME=PINECONE_INDEX_NAME:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest,LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest,ADMIN_SECRET=ADMIN_SECRET:latest,AWS_S3_BUCKET_NAME=AWS_S3_BUCKET_NAME:latest'
      - '--add-volume=name=models,type=cloud-storage,bucket=tos-model-bucket'
      - '--add-volume-mount=volume=models,mount-path=/app/models'
      - '--set-env-vars'
      - 'CLOUD_RUN_ENV=true,DEBUG=false,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=tos-summarizer-prod,ALLOWED_ORIGINS=https://tos-summarization.vercel.app'

  # ── 5. Smoke-test the tagged revision before routing traffic ─────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test'
    waitFor: ['deploy']
    entrypoint: 'bash'
    args:
      - 'scripts/smoke-test.sh'
      - '$_SERVICE_NAME'
      - '$_REGION'
      - '$PROJECT_ID'

  # ── 6. Migrate 100% traffic to the tested tagged revision ───────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'migrate-traffic'
    waitFor: ['smoke-test']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '$_SERVICE_NAME'
      - '--region'
      - '$_REGION'
      - '--to-tags'
      - 'candidate=100'

# ── Artifact Registry images produced ───────────────────────────────────────
images:
  - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'
  - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'

# ── Substitution defaults ────────────────────────────────────────────────────
substitutions:
  _AR_HOSTNAME:  'us-central1-docker.pkg.dev'
  _REPO_NAME:    'tos-repo'
  _SERVICE_NAME: 'tos-api'
  _REGION:       'us-central1'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true